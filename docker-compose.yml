services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: betledger
      POSTGRES_USER: betledger
      POSTGRES_PASSWORD: betledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betledger -d betledger"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
