services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: betledger
      POSTGRES_USER: betledger
      POSTGRES_PASSWORD: betledger
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betledger -d betledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # Tokens always carry the host-facing issuer, whether requested from the
      # host or from inside the network, while back-channel URLs such as the
      # JWKS follow the address used, so the application can reach them.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak/betledger-realm.json:/opt/keycloak/data/import/betledger-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30


  localstack:
    image: localstack/localstack:4.14
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./deploy/localstack/create-queues.sh:/etc/localstack/init/ready.d/create-queues.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf localhost:4566/_localstack/init/ready | grep -q '"completed": true'
      interval: 3s
      timeout: 3s
      retries: 40

  migrate:
    build: .
    image: betledger:local
    entrypoint: ["/usr/local/bin/migrate", "up"]
    environment:
      DATABASE_URL: postgres://betledger:betledger@postgres:5432/betledger?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: betledger:local
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: postgres://betledger:betledger@postgres:5432/betledger?sslmode=disable
      OIDC_ISSUER_URL: http://localhost:8081/realms/betledger
      OIDC_DISCOVERY_URL: http://keycloak:8080/realms/betledger
      OIDC_AUDIENCE: betledger-api
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 20s

volumes:
  postgres-data:
